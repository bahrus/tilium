<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageList Component Test</title>
  <style>
    body {
      font-family: "Roboto", "Helvetica", "Arial", sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    h2 {
      margin-top: 0;
      color: #1976d2;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@lit/": "/node_modules/@lit/",
        "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "/node_modules/@lit/reactive-element/",
        "lit": "/node_modules/lit/index.js",
        "lit/": "/node_modules/lit/",
        "lit-element/": "/node_modules/lit-element/",
        "lit-html/": "/node_modules/lit-html/",
        "lit-html": "/node_modules/lit-html/lit-html.js",
        "tslib": "/node_modules/tslib/tslib.es6.js",
        "tslib/": "/node_modules/tslib/"
      }
    }
  </script>
</head>
<body>
  <h1>ImageList Component Test</h1>

  <div class="section">
    <h2>Standard Image List</h2>

      <mui-image-list-item src="https://images.unsplash.com/photo-1551963831-b3b1ca40c98e?w=164&h=164&fit=crop&auto=format" alt="Breakfast">
        <mui-image-list-item-bar title="Breakfast" subtitle="by @bkristastucchio"></mui-image-list-item-bar>
      </mui-image-list-item>
      <mui-image-list-item src="https://images.unsplash.com/photo-1551782450-a2132b4ba21d?w=164&h=164&fit=crop&auto=format" alt="Burger">
        <mui-image-list-item-bar title="Burger" subtitle="by @rollelflex_graphy726"></mui-image-list-item-bar>
      </mui-image-list-item>
      <mui-image-list-item src="https://images.unsplash.com/photo-1522770179533-24471fcdba45?w=164&h=164&fit=crop&auto=format" alt="Camera">
        <mui-image-list-item-bar title="Camera" subtitle="by @helloimnik"></mui-image-list-item-bar>
      </mui-image-list-item>
      <mui-image-list-item src="https://images.unsplash.com/photo-1444418776041-9c7e33cc5a9c?w=164&h=164&fit=crop&auto=format" alt="Coffee">
        <mui-image-list-item-bar title="Coffee" subtitle="by @nolanissac"></mui-image-list-item-bar>

  <div class="section">
    <h2>Quilted Image List</h2>
    <mui-image-list variant="quilted" cols="4" gap="4" style="max-width: 500px; height: 400px;">
      <mui-image-list-item src="https://images.unsplash.com/photo-1551963831-b3b1ca40c98e?w=248&h=248&fit=crop&auto=format" alt="Breakfast" featured>
        <mui-image-list-item-bar title="Breakfast" subtitle="by @bkristastucchio"></mui-image-list-item-bar>
      </mui-image-list-item>
      <mui-image-list-item src="https://images.unsplash.com/photo-1551782450-a2132b4ba21d?w=164&h=164&fit=crop&auto=format" alt="Burger">
        <mui-image-list-item-bar title="Burger" subtitle="by @rollelflex_graphy726"></mui-image-list-item-bar>
      </mui-image-list-item>

      </mui-image-list-item>
    </mui-image-list>
  </div>

  <div class="section">
    <h2>Masonry Image List</h2>
    <mui-image-list variant="masonry" cols="3" gap="4" style="max-width: 500px; height: 400px;">
      <mui-image-list-item src="https://images.unsplash.com/photo-1549388604-817d15aa0110?w=164&h=230&fit=crop&auto=format" alt="Bed">

      </mui-image-list-item>
    </mui-image-list>
  </div>

  <div class="section">
    <h2>Woven Image List</h2>
    <mui-image-list variant="woven" cols="3" gap="4" style="max-width: 500px; height: 400px;">
      <mui-image-list-item src="https://images.unsplash.com/photo-1551963831-b3b1ca40c98e?w=164&h=164&fit=crop&auto=format" alt="Breakfast">
        <mui-image-list-item-bar title="Breakfast"></mui-image-list-item-bar>

      <mui-image-list-item src="https://images.unsplash.com/photo-1522770179533-24471fcdba45?w=164&h=164&fit=crop&auto=format" alt="Camera">
        <mui-image-list-item-bar title="Camera"></mui-image-list-item-bar>
      </mui-image-list-item>
    </mui-image-list>
  </div>

  <script type="module">
    // Import component classes
    import { ImageList, ImageListItem, ImageListItemBar } from './dist/index.js';

    // Register components with custom element names
    customElements.define('mui-image-list', ImageList);
    customElements.define('mui-image-list-item', ImageListItem);
    customElements.define('mui-image-list-item-bar', ImageListItemBar);

    console.log('ImageList test loaded successfully!');
  </script>
</body>
</html>
