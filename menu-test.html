<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Component Test</title>
  <style>
    body {
      font-family: "Roboto", "Helvetica", "Arial", sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    h2 {
      margin-top: 0;
      color: #1976d2;
    }
    .demo-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
  </style>
  <script type=importmap >
    {
        "imports": {
            "lit": "/node_modules/lit/index.js",
            "lit/": "/node_modules/lit/"
        }
    }
  </script>
</head>
<body>
  <h1>Menu Component Test</h1>

  <div class="section">
    <h2>Basic Menu</h2>
    <div class="demo-row">
      <mui-button id="basic-menu-button" variant="contained" color="primary">Open Menu</mui-button>
      <mui-menu id="basic-menu" anchorEl="basic-menu-button"></mui-menu>
    </div>
  </div>

  <div class="section">
    <h2>Menu with Icons</h2>
    <div class="demo-row">
      <mui-button id="icon-menu-button" variant="outlined" color="secondary">Menu with Icons</mui-button>
      <mui-menu id="icon-menu" anchorEl="icon-menu-button"></mui-menu>
    </div>
  </div>

  <script type="module">
    // Import component classes
    import { Menu, Button } from './dist/index.js';

    // Register components
    customElements.define('mui-menu', Menu);
    customElements.define('mui-button', Button);

    // Setup basic menu
    const basicMenuButton = document.getElementById('basic-menu-button');
    const basicMenu = document.getElementById('basic-menu');
    
    basicMenu.items = [
      { id: 'profile', label: 'Profile', icon: 'settings' },
      { id: 'account', label: 'My Account', icon: 'settings' },
      { id: 'logout', label: 'Logout', icon: 'settings' }
    ];
    
    basicMenuButton.addEventListener('click', () => {
      basicMenu.open = !basicMenu.open;
    });
    
    basicMenu.addEventListener('select', (e) => {
      console.log('Basic menu selected:', e.detail.item.label);
    });

    // Setup icon menu
    const iconMenuButton = document.getElementById('icon-menu-button');
    const iconMenu = document.getElementById('icon-menu');
    
    iconMenu.items = [
      { id: 'home', label: 'Home', icon: 'home' },
      { id: 'edit', label: 'Edit', icon: 'edit' },
      { id: 'delete', label: 'Delete', icon: 'delete' },
      { id: 'divider1', divider: true },
      { id: 'share', label: 'Share', icon: 'share' }
    ];
    
    iconMenuButton.addEventListener('click', () => {
      iconMenu.open = !iconMenu.open;
    });
    
    iconMenu.addEventListener('select', (e) => {
      console.log('Icon menu selected:', e.detail.item.label);
    });

    console.log('Menu component test loaded successfully!');
  </script>
</body>
</html>
