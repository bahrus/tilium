<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CircularProgress Fix Test</title>
  <style>
    body {
      font-family: "Roboto", "Helvetica", "Arial", sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    h2 {
      margin-top: 0;
      color: #1976d2;
    }
    .demo-row {
      display: flex;
      gap: 20px;
      align-items: center;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>CircularProgress Size Fix Test</h1>
  
  <div class="section">
    <h2>String Sizes (should work without errors)</h2>
    <div class="demo-row">
      <div>
        <p>Small:</p>
        <mui-circular-progress size="small" color="primary"></mui-circular-progress>
      </div>
      <div>
        <p>Medium:</p>
        <mui-circular-progress size="medium" color="secondary"></mui-circular-progress>
      </div>
      <div>
        <p>Large:</p>
        <mui-circular-progress size="large" color="error"></mui-circular-progress>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Numeric Sizes (should also work)</h2>
    <div class="demo-row">
      <div>
        <p>Size 20:</p>
        <mui-circular-progress size="20" color="warning"></mui-circular-progress>
      </div>
      <div>
        <p>Size 60:</p>
        <mui-circular-progress size="60" color="info"></mui-circular-progress>
      </div>
      <div>
        <p>Size 80:</p>
        <mui-circular-progress size="80" color="success"></mui-circular-progress>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Backdrop Test (the original issue)</h2>
    <p>This should work without the SVG width error:</p>
    <button onclick="showBackdrop()" style="background: #1976d2; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer;">
      Show Backdrop with Large CircularProgress
    </button>
    
    <mui-backdrop id="test-backdrop">
      <mui-circular-progress size="large" color="primary"></mui-circular-progress>
    </mui-backdrop>
  </div>

  <script type="module">
    // Import component classes
    import { CircularProgress, Backdrop } from './dist/index.js';

    // Register components
    customElements.define('mui-circular-progress', CircularProgress);
    customElements.define('mui-backdrop', Backdrop);

    // Helper function
    window.showBackdrop = () => {
      const backdrop = document.getElementById('test-backdrop');
      backdrop.open = true;
      
      // Auto-close after 3 seconds
      setTimeout(() => {
        backdrop.open = false;
      }, 3000);
    };

    // Setup backdrop click handler
    document.getElementById('test-backdrop').addEventListener('backdrop-click', (e) => {
      e.target.open = false;
    });

    console.log('CircularProgress fix test loaded successfully!');
  </script>
</body>
</html>
